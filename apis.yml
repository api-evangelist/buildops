apis:
- aid: buildops:public-api
  name: BuildOps Public API
  description: 'The BuildOps Public API, named by the BuildOps Dev Center as the REST
    + webhook-callback integration surface for customers, software partners and vendors.
    The Dev Center gates its reference behind "Invite Required"; the production host
    is live and answers unauthenticated health checks but publishes no OpenAPI. Recorded
    here as a real but undocumented API surface.'
  humanURL: https://developer.buildops.com/docs/buildops-public-api
  baseURL: https://public-api.live.buildops.com
  tags:
  - Field Service Management
  - Contractor Management
  - Construction Software
  properties:
  - type: Documentation
    url: https://developer.buildops.com/docs/buildops-public-api
  x-access: gated
  x-evidence:
    fetched: '2026-08-10'
    humanurl_status: 404
    humanurl_note: >-
      "Invite Required - Reach out to your IM or CSM to get access to the
      documentation above." The doc node is not published to the public Stoplight
      project, so the link on the Dev Center landing page 404s.
    baseurl_discovery: >-
      Host read from the production host map in BuildOps' own public web-client
      bundle at https://live.buildops.com/static/js/main.7f23205c.js, which names
      public-api.live.buildops.com as the PROD entry alongside
      rest-api.live.buildops.com and graphql.live.buildops.com. Not stated in any
      BuildOps documentation; recorded from a live probe, not from the docs.
    baseurl_probes:
    - {url: 'https://public-api.live.buildops.com/', status: 200, body: 'OK!'}
    - {url: 'https://public-api.live.buildops.com/health', status: 200, body: 'OK!'}
    - {url: 'https://public-api.live.buildops.com/openapi.json', status: 404}
    - {url: 'https://public-api.live.buildops.com/swagger.json', status: 404}
    - {url: 'https://public-api.live.buildops.com/api-json', status: 404}
    server_note: >-
      404 bodies are NestJS-shaped ({"statusCode":404,"message":"Cannot GET
      /openapi.json"}), confirming a live application rather than a CDN catch-all.
      No specification is served on any conventional path.
x-contract-discovery:
  checked: '2026-08-10'
  method: probed
  finding: >-
    Machine-readable contracts for BuildOps DO exist and are generated by the
    running services - they are auth-gated, not absent. Two probes prove it:
    api.core.live.buildops.com serves the springdoc path /v3/api-docs and answers
    401 "Authorization token isn`t provided" (a missing spec would 404), and
    graphql.live.buildops.com/graphql answers a GraphQL introspection POST with a
    403 "Your authorization token is invalid" rather than a transport error. This
    is why the coverage state is `gated` and not `unreadable` or `none`.
  probes:
  - {url: 'https://api.core.live.buildops.com/v3/api-docs', status: 401, note: springdoc
      OpenAPI endpoint present, token required}
  - {url: 'https://api.core.live.buildops.com/swagger-ui/index.html', status: 403}
  - {url: 'https://graphql.live.buildops.com/graphql', status: 403, note: GraphQL
      introspection rejected - "Your authorization token is invalid"}
  - {url: 'https://rest-api.live.buildops.com/openapi.json', status: 401, note: unauthorized
      request}
  - {url: 'https://public-api.live.buildops.com/openapi.json', status: 404}
  production_hosts_named_in_web_client:
  - account-management-svc.live.buildops.com
  - api.core.live.buildops.com
  - batch-operation.live.buildops.com
  - bim-svc.live.buildops.com
  - core.live.buildops.com
  - crmplus-api.live.buildops.com
  - equipment-svc.live.buildops.com
  - graphql.live.buildops.com
  - project-management-api.live.buildops.com
  - public-api.live.buildops.com
  - rest-api.live.buildops.com
  - search-query.live.buildops.com
  source: https://live.buildops.com/static/js/main.7f23205c.js
  note: >-
    These are the application's own service hosts, discovered from a public
    JavaScript bundle. They are recorded as evidence that the API estate is real
    and reachable, NOT as documented public endpoints. Only public-api is promoted
    to an apis[] entry, because it is the one the provider itself names as public.
