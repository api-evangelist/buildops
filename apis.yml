name: BuildOps
description: 'BuildOps is an AI-native, all-in-one commercial contractor management
  platform for multi-trade service and construction companies. It unifies project
  management, service operations, dispatch and scheduling, financials and invoicing,
  and sales/CRM into a single system used by 1,500+ contractors across HVAC, electrical,
  plumbing, fire safety, and refrigeration trades. Backed by Founders Fund, the company
  offers pre-built integrations with ERP and accounting systems (QuickBooks, Sage,
  Vista, Spectrum, NetSuite) plus field-intelligence, payroll, and procurement tools.
  BuildOps operates a public Dev Center that names a BuildOps Public API offering REST
  endpoints and webhook callbacks, but that API documentation is marked "Invite Required"
  and is reachable only through an implementation or customer-success manager. No OpenAPI,
  AsyncAPI, GraphQL SDL or Postman collection is published anywhere, and no first-party
  SDK exists in any public registry. The only public Dev Center project is a Data
  Dictionary describing BuildOps datasets on the Dashboard module and a Snowflake private
  share. BuildOps does publish a security policy and a Vanta-hosted Trust Center carrying
  SOC 2 Type I.'
